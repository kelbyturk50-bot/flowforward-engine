name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fftest
          POSTGRES_PASSWORD: fftest
          POSTGRES_DB: flowforward_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fftest -d flowforward_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
        env:
          DATABASE_URL: postgresql://fftest:fftest@127.0.0.1:5432/flowforward_test
          NODE_ENV: test
